<div class="card">
  <div class="search-form">
    <div class="form-row">
      <div class="form-item">
        <label>供应商</label>
        <input type="text" placeholder="请输入" id="promoFilterSupplier">
      </div>
      <div class="form-item">
        <label>活动时间</label>
        <div class="date-range">
          <input type="text" placeholder="开始时间" readonly id="promoFilterStart" style="width:110px;">
          <span class="sep">~</span>
          <input type="text" placeholder="结束时间" readonly id="promoFilterEnd" style="width:110px;">
        </div>
      </div>
      <div class="form-item">
        <label>状态</label>
        <select style="height:32px;border:1px solid #d9d9d9;border-radius:4px;padding:0 8px;font-size:13px;" id="promoFilterStatus">
          <option value="">全部</option>
          <option value="待执行">待执行</option>
          <option value="执行中">执行中</option>
          <option value="已完成">已完成</option>
          <option value="禁用">禁用</option>
          <option value="已暂停">已暂停</option>
          <option value="已过期">已过期</option>
        </select>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="filterPromotions()">🔍 查询</button>
        <button class="btn" style="margin:0 4px;" onclick="resetPromoFilter()">🔄 重置</button>
        <button class="btn" style="margin:0 4px;" onclick="refreshPromotions()">🔃 刷新</button>
        <button class="btn btn-green" onclick="openPromoModal()">＋ 新增</button>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <colgroup><col style="width:60px;min-width:60px;"><col style="width:60px;min-width:60px;"><col style="width:120px;min-width:120px;"><col><col><col><col><col><col><col></colgroup>
      <thead><tr>
        <th>活动ID</th><th>操作</th><th>活动名称</th><th>供应商</th><th>关联货源</th><th>折扣</th><th>开始时间</th><th>结束时间</th><th>创建时间</th><th>状态</th>
      </tr></thead>
      <tbody id="promoTableBody"></tbody>
    </table>
  </div>

  <div class="pagination" id="promoPagination"></div>
</div>
